name: Build sites

# For each site: stream lidar points -> bare-earth DTM -> relief products ->
# web layers -> NAIP -> forge3d stills and an orbit video (on GitHub's CPUs,
# Mesa's software Vulkan under a virtual display). Then commit sites/.
on:
  workflow_dispatch:
    inputs:
      sites:
        description: "Site ids, comma-separated, or 'all'"
        default: "all"
      orbit:
        description: "Render the orbit video"
        type: boolean
        default: true
      seconds:
        description: "Orbit length (s)"
        default: "14"

permissions:
  contents: write

env:
  PYTHONUNBUFFERED: "1"

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      sites: ${{ steps.p.outputs.sites }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          python3 - <<'EOF' >> "$GITHUB_OUTPUT"
          import json, yaml
          want = "${{ inputs.sites }}".strip()
          cat = list(yaml.safe_load(open("sites.yaml"))["sites"])
          ids = cat if want in ("", "all") else [s.strip() for s in want.split(",") if s.strip() in cat]
          print("sites=" + json.dumps(ids))
          EOF

  site:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 170
    strategy:
      fail-fast: false
      matrix:
        site: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: actions/checkout@v5
      - uses: prefix-dev/setup-pixi@v0.9.0
        with:
          cache: false
          locked: false
      - name: Cache downloaded point-cloud tiles
        uses: actions/cache@v4
        with:
          path: data/sites/${{ matrix.site }}/laz
          key: laz-${{ matrix.site }}-v1
      - name: Software Vulkan + virtual display
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mesa-vulkan-drivers libvulkan1 xvfb libx11-xcb1 libxkbcommon-x11-0 libxkbcommon0 libxcursor1 libxi6 libxrandr2 libxcb-xkb1 libxcb-randr0 libxcb-shape0 libxcb-xfixes0 libwayland-client0 libegl1 >/dev/null
      - name: Lidar -> relief -> web layers
        run: |
          set -o pipefail
          pixi run kiva build ${{ matrix.site }} 2>&1 | tee -a build.log
          pixi run kiva photo ${{ matrix.site }} 2>&1 | tee -a build.log
      - name: forge3d stills
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" pixi run kiva stills ${{ matrix.site }} 2>&1 | tee -a build.log
      - name: forge3d orbit
        if: inputs.orbit
        env:
          XDG_RUNTIME_DIR: /tmp
        run: |
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" pixi run kiva orbit ${{ matrix.site }} --seconds ${{ inputs.seconds }} 2>&1 | tee -a build.log | grep -v "  frame" || true
          test -n "$(ls data/sites/${{ matrix.site }}/frames/frame_*.jpg 2>/dev/null)"
          pixi run kiva encode ${{ matrix.site }}
      - name: Keep the log
        if: always()
        run: mkdir -p sites/${{ matrix.site }} && cp build.log sites/${{ matrix.site }}/build.log || true
      - name: Push the log when a step fails
        if: failure() || cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/l && cp build.log /tmp/l/ 2>/dev/null; cd /tmp/l && git init -q -b logs
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m log && git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" logs:build-log-${{ matrix.site }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: site-${{ matrix.site }}
          path: sites/${{ matrix.site }}/
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: matrix.site == 'cahokia'
        with:
          name: pixi-lock
          path: pixi.lock
          retention-days: 7

  publish:
    needs: site
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          pattern: site-*
          path: incoming
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: pixi-lock
          path: lock
      - name: Commit the sites
        run: bash scripts/publish_sites.sh 2>&1 | tee publish.log
      - name: Push the log when publishing fails
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/l && cp publish.log /tmp/l/; cd /tmp/l && git init -q -b logs
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m log && git push -f -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" logs:publish-log
