[workspace]
name = "project-kiva"
description = "Reading the ground with lasers: archaeological lidar, rendered with forge3d"
version = "2.0.0"
channels = ["conda-forge"]
platforms = ["win-64", "linux-64"]

[tasks]
kiva     = "python -m kiva.cli"
sites    = "python -m kiva.cli sites"
serve    = "python -m http.server 8000"
test     = "python -m pytest -q tests"
epoch    = "python scripts/epoch_check.py"
global   = "python scripts/fetch_global_dem.py"

[dependencies]
python            = "3.12.*"
# points
pdal              = ">=2.8"
python-pdal       = ">=3.4"
# rasters
rasterio          = ">=1.4"
pyproj            = ">=3.6"
numpy             = ">=1.26"
scipy             = ">=1.12"
pillow            = ">=10.0"
# imagery
pystac-client     = ">=0.8"
planetary-computer = ">=1.0"
# plumbing
click             = ">=8.1"
pyyaml            = ">=6.0"
requests          = ">=2.31"
ffmpeg            = ">=6"
pytest            = ">=8"

[pypi-dependencies]
forge3d = "==1.40.1"

[feature.notebook.dependencies]
jupyterlab = ">=4.1"
matplotlib = ">=3.8"

[feature.notebook.tasks]
notebooks = "jupyter lab notebooks/"

[environments]
notebook = ["notebook"]
